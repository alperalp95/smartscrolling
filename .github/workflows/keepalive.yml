# Canlı tutma: GitHub, uzun süre hareketsiz kalan depolarda zamanlanmış workflow'ları kendiliğinden
# kapatabilir (eski içerik hattı 3 ay böyle sessizce durdu). Bu workflow ayda bir, içerik hattı
# workflow'larını (ve kendisini) yeniden "etkin" yapar. Zararsızdır: hiçbir şey çalıştırmaz,
# sadece workflow'ların açık kalmasını sağlar. Kapı yok.
name: keepalive

on:
  schedule:
    # Her ayın 1'i, 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Keep scheduled workflows enabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable workflows
        shell: bash
        run: |
          for wf in content-v2.yml content-v2-weekly-sample.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "$wf etkin"
          done
