# İçerik hattı v2 — günlük üretim: topla → işle → (yayınla), sorun varsa GitHub Issue (alarm).
# Ayrıntı ve açma/kapama: packages/pipeline/README.md → "Otomatik çalışma".
#
# KAPI: Zamanlanmış run'lar, repo değişkeni CONTENT_V2_ENABLED = true olana kadar hiçbir şey yapmaz
# (job atlanır). Elle çalıştırma (Run workflow) her zaman çalışır.
name: content-v2

on:
  schedule:
    # Günde 3 kez: 03:17, 11:17, 19:17 UTC (İstanbul 06:17, 14:17, 22:17).
    # Kartlar sadece 19:17 run'ında yayınlanır; diğer ikisi sadece üretir (stoğa ekler).
    - cron: "17 3,11,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = veritabanına hiçbir şey yazmaz; apply = gerçekten yazar"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      publish:
        description: "Günün kartlarını da yayınla (apply ile birlikte anlamlı)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: content-v2
  cancel-in-progress: false

jobs:
  run:
    name: Content pipeline v2
    if: github.event_name == 'workflow_dispatch' || vars.CONTENT_V2_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Determine mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          AUTO_PUBLISH: ${{ vars.CONTENT_V2_AUTO_PUBLISH }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$INPUT_MODE"
            publish="$INPUT_PUBLISH"
          else
            mode="apply"
            # Otomatik yayın ayrı bir anahtara bağlı: CONTENT_V2_AUTO_PUBLISH == true olmalı.
            # Yayın sadece günün son run'ında (19:17 UTC). GitHub zamanlanmış run'ları gecikmeli
            # başlatabildiği için 19:00-02:59 UTC arası "son run" sayılır.
            publish="false"
            if [[ "$AUTO_PUBLISH" == "true" ]]; then
              hour="$(date -u +%H)"
              if [[ "$hour" -ge 19 || "$hour" -lt 3 ]]; then publish="true"; fi
            else
              echo "Otomatik yayın kapalı (CONTENT_V2_AUTO_PUBLISH != true)"
            fi
          fi
          if [[ "$mode" != "apply" && "$mode" != "dry-run" ]]; then
            echo "Geçersiz mod: $mode" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Mod: $mode, yayın: $publish"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Sadece pipeline paketinin bağımlılıkları (Expo / mobil uygulama kurulmaz).
      - name: Install pipeline dependencies
        run: npm ci --workspace @smartscrolling/pipeline

      - name: Run content pipeline v2
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          args=(--mode "$MODE" --collect-limit 300 --process-limit 300 --backfill-from 2024-02 --backfill-months 1)
          if [[ "$PUBLISH" == "true" ]]; then args+=(--publish); fi
          # stdout = tek satır JSON özet (dosyaya); log stderr'de görünür.
          node packages/pipeline/src/runners/v2-daily.js "${args[@]}" > "$RUNNER_TEMP/content-v2-summary.json"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "### İçerik hattı v2"
            echo
            if jq -e . "$RUNNER_TEMP/content-v2-summary.json" > /dev/null 2>&1; then
              echo '```json'
              jq '{ok, mode, trigger, queued, duration_ms, collect: .steps.collect.total, publish: .steps.publish, rejectReasons, alarms: [.alarms[]?.code], errors}' "$RUNNER_TEMP/content-v2-summary.json"
              echo '```'
            else
              echo "Özet üretilemedi (run erken durdu). Log'a bakın."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Alarm varsa Issue açar; aynı etiketle açık Issue varsa yenisini açmak yerine ona yorum ekler.
      # Sadece apply modunda (dry-run'da alarmlar yalnızca run özetinde görünür).
      - name: Open alarm issue
        if: always() && steps.mode.outputs.mode == 'apply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title_file="$RUNNER_TEMP/alarm-title.txt"
          body_file="$RUNNER_TEMP/alarm-body.md"
          if jq -e '.alarms' "$RUNNER_TEMP/content-v2-summary.json" > /dev/null 2>&1; then
            if [[ "$(jq '.alarms | length' "$RUNNER_TEMP/content-v2-summary.json")" == "0" ]]; then
              echo "Alarm yok."
              exit 0
            fi
            jq -r '.issue.title' "$RUNNER_TEMP/content-v2-summary.json" > "$title_file"
            jq -r '.issue.body' "$RUNNER_TEMP/content-v2-summary.json" > "$body_file"
          else
            echo "İçerik hattı alarmı: run özet üretemeden durdu" > "$title_file"
            {
              echo "## Ne oldu?"
              echo
              echo "İçerik hattı run'ı özet üretemeden durdu (kurulum adımı hatası, zaman aşımı ya da beklenmeyen bir hata)."
              echo
              echo "**Ne yapmalısınız?** [Run kaydını]($RUN_URL) açın ve kırmızı (başarısız) adımın log'una bakın."
              echo "Tek seferlikse bir sonraki run'da kendiliğinden düzelebilir."
              echo
              echo "<sub>Bu Issue içerik hattı tarafından otomatik açıldı (\`content-v2\` workflow).</sub>"
            } > "$body_file"
          fi
          gh label create pipeline-alarm --color B60205 --description "İçerik hattı alarmı (otomatik)" --force
          existing="$(gh issue list --label pipeline-alarm --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
            echo "Açık alarm Issue'suna yorum eklendi: #$existing"
          else
            gh issue create --title "$(cat "$title_file")" --label pipeline-alarm --body-file "$body_file"
          fi
