name: Facts Ingest

on:
  schedule:
    # 08:17 and 20:17 Europe/Istanbul.
    - cron: "17 5,17 * * *"
    # Backup check at 08:47 and 20:47 Europe/Istanbul.
    - cron: "47 5,17 * * *"
    # Weekly catch-up check: Sunday 09:17 Europe/Istanbul.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backup
          - catchup

permissions:
  contents: read

concurrency:
  group: facts-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Facts ingest
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "17 6 * * 0" ]]; then
            echo "mode=catchup" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "47 5,17 * * *" ]]; then
            echo "mode=backup" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Check backup ingest window
        if: steps.mode.outputs.mode == 'backup'
        id: backup
        run: npm run facts:daily-check -- --hours 12 --floor 15

      - name: Run daily facts ingest
        if: steps.mode.outputs.mode == 'daily'
        run: npm run facts:daily-ingest

      - name: Run backup facts ingest
        if: steps.mode.outputs.mode == 'backup' && steps.backup.outputs.needs_ingest == 'true'
        run: npm run facts:daily-ingest

      - name: Skip backup facts ingest
        if: steps.mode.outputs.mode == 'backup' && steps.backup.outputs.needs_ingest != 'true'
        run: echo "Recent facts floor already satisfied; backup ingest skipped."

      - name: Send content freshness push
        if: steps.mode.outputs.mode == 'daily' || (steps.mode.outputs.mode == 'backup' && steps.backup.outputs.needs_ingest == 'true')
        shell: bash
        run: |
          response="$(curl -fsS -X POST "$SUPABASE_URL/functions/v1/content-freshness-push" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"send"}')"
          echo "$response"

      - name: Check weekly facts floor
        if: steps.mode.outputs.mode == 'catchup'
        id: weekly
        run: npm run facts:weekly-check -- --floor 100 --days 7

      - name: Run weekly catch-up
        if: steps.mode.outputs.mode == 'catchup' && steps.weekly.outputs.needs_catchup == 'true'
        run: npm run facts:wikipedia-catchup

      - name: Skip weekly catch-up
        if: steps.mode.outputs.mode == 'catchup' && steps.weekly.outputs.needs_catchup != 'true'
        run: echo "Weekly facts floor already satisfied; catch-up skipped."
