appId: com.smartscrolling.mobile
---
# Misafir akisi: giris yapilmamisken profil ekraninda giris cagrisi gorunur,
# hesap silme girisi gorunmez.
- launchApp
- tapOn: Profil
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 10000
- assertVisible: Hesabini Bagla
- assertVisible: Google ile Devam Et
- assertVisible:
    id: auth-email-toggle
- assertNotVisible:
    id: account-delete-entry
# Misafir Karta Sor: giris isteme metni gorunur, kapatilir.
- tapOn: Akis
- extendedWaitUntil:
    visible:
      id: card-ask-button
    timeout: 20000
- tapOn:
    id: card-ask-button
- extendedWaitUntil:
    visible: "Giriş gerekli"
    timeout: 10000
- tapOn: Daha Sonra
