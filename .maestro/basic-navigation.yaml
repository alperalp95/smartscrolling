appId: com.smartscrolling.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 15000
- assertVisible:
    id: feed-screen
- tapOn:
    id: tab-saved
- extendedWaitUntil:
    visible:
      id: saved-screen
    timeout: 10000
- assertVisible:
    id: saved-screen
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: profile-screen
    timeout: 10000
- assertVisible:
    id: profile-screen
- tapOn:
    id: tab-index
- extendedWaitUntil:
    visible:
      id: feed-screen
    timeout: 10000
