appId: com.smartscrolling.mobile
---
- launchApp
- tapOn: Kutuphane
- extendedWaitUntil:
    visible:
      id: library-free-book-card
    timeout: 20000
- tapOn:
    id: library-free-book-card
- extendedWaitUntil:
    visible:
      id: reader-screen
    timeout: 10000
- assertVisible:
    id: reader-screen
